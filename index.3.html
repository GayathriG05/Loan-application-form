<!DOCTYPE html>
<html lang="en">

<head>
    <style>
        .textbox {
            width: 110px;
            height: 32px;
            padding: 10px -10px 10px 10px;
            border: 5px solid black;
            margin: 0;
        }
    </style>
</head>

<body>
    <h3>
        Create text inside box using HTML and CSS
    </h3>
    <p>
        In this example we have used 
        CSS padding and border property.
    </p>
    <h1>
        <span class="textbox">Tutorials</span>Point
    </h1>
</body>

</html>
