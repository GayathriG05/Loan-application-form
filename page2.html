<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    
    <style>
        .navbar {
            background-color: #d0f0c0 ;
            height: 200px;
        }
        .navbar-brand {
            color: white; /* Optional: Change text color for better contrast */
        }
        .form-group {
            margin-left: auto; /* Align to the right of the navbar */
        }
        .form-check-inline {
            margin-left: 15px;
        }
        .navbar-brand, .form-check-label {
            color: black; /* Optional: Change text color for better contrast */
        }
        .loan{
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-lg-12 d-flex align-items-center">
                <nav class="navbar navbar-expand-lg w-100">
                    <a class="navbar-brand" href="#"><span class="Sunrise">Sunrise</span>
                        <br><span class="development">women development</span>
                        <br><span class="foundation">foundation</span>
                    </a>
                    <div class="form-group d-flex align-items-center">
                        <label class="mr-3"><SPAN class="loan">LOAN AMOUNT</SPAN></label>
                        <div class="form-check form-check-inline">
                            <input type="radio" class="form-check-input" id="radio1" name="optradio" value="option1">
                            <label class="form-check-label" for="radio1">10,000</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input type="radio" class="form-check-input" id="radio2" name="optradio" value="option2">
                            <label class="form-check-label" for="radio2">20,000</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input type="radio" class="form-check-input" id="radio3" name="optradio">
                            <label class="form-check-label">30,000</label>
                        </div>
                    </div>
                </nav>
            </div>
        </div>
    </div>
        <div class="container">
            <H>ADDRESS DETAILS</H>
            <div class="row gy-2">
            <div class="col-lg-12">
                <label>Residence city</label>
                <input type="text" class="form-control" name="R-Name" id="R-name1" placeholder="Residence city">
            </div>
            <div class="col-lg-2">
                    <label>Residence type</label>
            </div>
            <div class="col-lg-6">
                <div class="form-check form-check-inline">
                    <input type="radio" class="form-check-input" name="optradio" id="radio1">
                    <label class="form-check-label" for="radio1">Owned by self or spouse parent</label>
                    </div>
                    <div class="form-check form-check-inline">
                        
                        <input type="radio" class="form-check-input" name="optradio" id="radio1">
                        <label class="form-check-label" for="radio1">Sibling</label>
                        </div>

                        <div class="form-check form-check-inline">
                            
                            <input type="radio" class="form-check-input" name="optradio" id="radio1">
                            <label class="form-check-label" for="radio1">Relative Owned</label>
                            </div>
            </div>
            <div class="row gy-2">
            <div class="col-lg-2">
                <label>Own House Proof</label>
            </div>
            <div class="col-lg-4">
                <div class="form-check form-check-inline">
                    <input type="radio" class="form-check-input" name="optradio" id="radio1">
                    <label class="form-check-label" for="radio1">YES</label>
                </div>
                <div class="form-check form-check-inline">
                    <input type="radio" class="form-check-input" name="optradio" id="radio1">
                    <label class="form-check-label" for="radio1">NO</label>
                </div>
                </div>
                <div class="col-lg-4">
                    <label >Residential Status</label>
                    <div class="form-check form-check-inline">
                        <input type="radio" class="form-check-input" name="optradio" id="radio1">
                        <label class="form-check-label" for="radio1">Resident</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input type="radio" class="form-check-input" name="optradio" id="radio1">
                        <label class="form-check-label" for="radio1">Non-resident</label>
                    </div>
                    </div>
        </div>

        <div class="col-lg-12">
            <label >Monthly Rental Payable</label>
            <input type="number" class="form-control" name="pay" id="Monthly-pay" placeholder="Monthly Rental payable">
        </div>
        <div class="row gy-2">
            <div class="col-lg-4">
            <label for="mon">No.of months & years in the house</label>
            </div>
             <div class="col-lg-4">
                <label for="years">Years</label>
                <input type="text" class="form-control" name="years" id="years">
            </div>
            <div class="col-lg-4">
                <label for="months" >Months</label>
                <input type="number" class="form-control" name="months" id="Months">
            </div>
    </div>

    <div class="col-lg-12">
        <label>Permanent Address Line</label>
        <input type="number" class="form-control" name="address" id="Address">
    </div>

    <div class="row gy-2">
        <div class="col-lg-6">
            <label>Landmark</label>
           <input type="text" class="form-control" name="landmark" id="landmark">
        </div>

        <div class="col-lg-6">
            <label>State</label>
           <input type="text" class="form-control" name="state" id="State">
        </div>
    </div>

    <div class="row gy-2">
        <div class="col-lg-6">
            <label>Village/Town/City</label>
           <input type="text" class="form-control" name="Name2" id="Name2">
        </div>

        <div class="col-lg-6">
            <label>Pincode</label>
           <input type="number" class="form-control" name="Pincode" id="Pincode">
        </div>
    </div>

    <div class="col-lg-12">
        <label>No(Appplicant) or AADHAR Enrollment Number</label>
        <input type="number" class="form-control" name="Enrolled" id="Enrolled">
    </div>

    <div class="row gy-2">
        <div class="col-lg-6">
            <label>Voter-ID</label>
           <input type="text" class="form-control" name="ID" id="ID">
        </div>

        <div class="col-lg-6">
            <label>Ration Card </label>
           <input type="text" class="form-control" name="RC" id="RC">
        </div>
    </div>

    <div class="row gy-2">
        <div class="col-lg-12">
           
                <button type="button" class="btn btn-success">	&lt;</button>
            <button type="button" class="btn btn-success">SAVE AND NEXT</button>
      
    </div>
    </div>
            









        </div>
    </div>

    <script src="js/bootstrap.min.js"></script>
