<!DOCTYPE html>
<html>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css?family=Raleway" rel="stylesheet">
<link rel="stylesheet" href="css/bootstrap.min.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.4.0/css/font-awesome.min.css" />

<style>
* {
  box-sizing: border-box;
}

body {
  background-color: #f1f1f1;
}

.loan {
  font-size: 17px;
  font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
  padding-right: 15px;
}

#regForm {
  background-color: #ffffff;
  margin: 100px auto;
  font-family: Raleway;
  padding: 40px;
  width: 70%;
  min-width: 300px;
}

input {
  padding: 10px;
  width: 100%;
  font-size: 17px;
  font-family: Raleway;
  border: 1px solid #aaaaaa;
}

/* Mark input boxes that gets an error on validation: */
input.invalid {
  background-color: #ffdddd;
}

/* Hide all steps by default: */
.tab {
  display: none;
}

button {
  background-color: #04AA6D;
  color: #ffffff;
  border: none;
  padding: 10px 20px;
  font-size: 17px;
  font-family: Raleway;
  cursor: pointer;
}

button:hover {
  opacity: 0.8;
}

#prevBtn {
  background-color: #bbbbbb;
}

/* Make circles that indicate the steps of the form: */
.step {
  height: 15px;
  width: 15px;
  margin: 0 2px;
  background-color: #bbbbbb;
  border: none;  
  border-radius: 50%;
  display: inline-block;
  opacity: 0.5;
}

.step.active {
  opacity: 1;
}

/* Mark the steps that are finished and valid: */
.step.finish {
  background-color: #04AA6D;
}

.navbar {
  background-color: #f7dff3;
  justify-content: space-between;
  border-radius: 30px;
  align-items: center; /* Center align items vertically */
}

.navbar-brand {
  font-family: Verdana, sans-serif;
  text-align: left;
  line-height: 22px;
  padding-left: 30px;
  margin-left: 15px;
  padding-bottom: 25px;
  padding-top: 25px;
  display: flex;
  align-items: center;
}

.form-group {
  display: flex;
  align-items: center;
  margin-left: auto;
}

.logo {
  height: 70px; /* Adjust the size as needed */
  padding-top: 0px;
  margin-bottom: 10px;
  margin-left: 10px;
}

.SR {
  font-size: 20px;
  font-weight: bolder;
  line-height: 15px;
}

@font-face {
  font-family: 'Agency FB';
  src: url('fonts/AgencyFB.ttf') format('truetype');
}

.DEVEL {
  font-family: 'Agency FB', sans-serif;
  font-size: 17px;
  line-height: 15px; /* Adjust line height to remove gap */
  color: rgb(219, 119, 13);
  font-weight: bold;
}

.FN {
  font-size: 15px;
  line-height: 0px;
}

.form-check-label {
  padding-right: 15px;
}

.navbar-brand div {
  display: flex;
  flex-direction: column;
  align-items: center;
}

@media (max-width: 767px) {
  .navbar {
    flex-direction: column;
    align-items: flex-start;
  }
  .form-group {
    margin-top: 10px;
    width: 100%;
    justify-content: center;
  }
  .form-check-inline {
    display: block;
    margin: 5px 0;
  }
}

</style>
<body>
  
  <div class="row">
    <div class="col-lg-12 d-flex align-items-center">
      <nav class="navbar navbar-expand-lg w-100">
        <a class="navbar-brand d-flex align-items-center" href="#">
          <img src="inno fin.png" alt="logo" class="logo">
          <div>
            <span class="SR">S U N R I S E</span>
            <span class="DEVEL">WOMEN DEVELOPMENT</span>
            <span class="FN">F O U N D A T I O N</span>
          </div>
        </a>
        <div class="form-group d-flex align-items-center">
          <label class="mr-3"><span class="loan">LOAN AMOUNT</span></label>
          <div class="form-check form-check-inline">
            <input type="radio" class="form-check-input" id="radio1" name="optradio" value="option1">
            <label class="form-check-label" for="radio1">&nbsp;&nbsp;&#8377; 10,000</label>
          </div>
          <div class="form-check form-check-inline">
            <input type="radio" class="form-check-input" id="radio2" name="optradio" value="option2">
            <label class="form-check-label" for="radio2">&#8377; 20,000</label>
          </div>
          <div class="form-check form-check-inline">
            <input type="radio" class="form-check-input" id="radio3" name="optradio">
            <label class="form-check-label">&#8377; 30,000</label>
          </div>
        </div>
      </nav>
    </div>
  </div>
</body>
</html>
